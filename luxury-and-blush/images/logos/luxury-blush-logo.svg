<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#FAF8F5" stroke="#E8DDD3" stroke-width="2"/>

  <!-- Geometric triangular pattern forming "L&B" -->
  <!-- Left triangle (L shape) -->
  <polygon points="50,60 60,60 60,140 50,140" fill="#b8986e" opacity="0.9"/>
  <polygon points="50,60 80,60 75,65 55,65" fill="#d4bc96"/>
  <polygon points="50,135 80,140 75,145 55,140" fill="#d4bc96"/>

  <!-- Ampersand made of geometric lines -->
  <g stroke="#b8986e" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Upper curve of ampersand -->
    <path d="M 95 65 Q 105 55 115 65"/>
    <!-- Middle diagonal -->
    <path d="M 100 80 L 110 100"/>
    <!-- Lower loop -->
    <path d="M 110 100 Q 120 110 110 125 Q 100 130 90 125"/>
  </g>

  <!-- Right elements (B shape with triangles) -->
  <polygon points="140,60 150,60 150,100 140,100" fill="#b8986e" opacity="0.9"/>
  <polygon points="150,100 160,105 150,110" fill="#d4bc96"/>
  <polygon points="140,100 150,100 150,140 140,140" fill="#b8986e" opacity="0.9"/>
  <polygon points="150,135 160,140 150,145" fill="#d4bc96"/>

  <!-- Accent line at bottom -->
  <line x1="50" y1="155" x2="150" y2="155" stroke="#d4bc96" stroke-width="2"/>
</svg>